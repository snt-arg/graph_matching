procs:
  rviz:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && source /home/adminpc/workspace/install/setup.bash && rviz2 -d /home/adminpc/workspace/src/situational_graphs/lidar_situational_graphs/rviz/s_graphs_ros2.rviz"'
    autostart: false
  s_graphs_sim:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && source /home/adminpc/workspace/install/setup.bash && ros2 launch lidar_situational_graphs s_graphs_launch.py compute_odom:=true lidar_topic:=/point_cloud base_frame:=base_footprint"'
    autostart: false
  s_graphs_real:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && source /home/adminpc/workspace/install/setup.bash && ros2 launch lidar_situational_graphs s_graphs_launch.py compute_odom:=true lidar_topic:=/ouster/points base_frame:=base_link"'
    autostart: false
  rosbag_sim:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && sleep 3 && ros2 bag play /home/adminpc/rosbags_matching/graph_matching_debug/rosbag2_2026_02_03-17_23_39 --clock"'
    autostart: true
  rosbag_real:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && sleep 3 && ros2 bag play /home/adminpc/workspace/src/datasets/Real/C1F2/C1F2_ros2 --clock"'
    autostart: false
  is_graphs_sim:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && sleep 1 && source /home/adminpc/workspace/install/setup.bash && ros2 launch is_graphs is_graph_launch.py lidar_topic:=/platform/velodyne_points compute_odom:=true base_frame:=base_link"'
    autostart: false
  is_graphs_real:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && sleep 1 && source /home/adminpc/workspace/install/setup.bash && ros2 launch is_graphs is_graph_launch.py lidar_topic:=/platform/velodyne_points compute_odom:=false base_frame:=body"'
    autostart: false
  matching:
    shell: 'bash -c "source /opt/ros/jazzy/setup.bash && source /home/adminpc/workspace/install/setup.bash &&  ros2 launch graph_matching graph_matching.launch.py"'
    autostart: true

